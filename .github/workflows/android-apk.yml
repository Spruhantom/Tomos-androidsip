name: TomOS SIP Android APK

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tomos-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  unit-tests:
    name: Run Kotlin unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TomOS-SIP-Unit-Test-Reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Main-branch APKs must use the repository's persistent signing identity.
      # Pull requests from forks may not receive secrets, so they can still run tests
      # and build an unsigned-by-project-identity debug APK without publishing it.
      - name: Prepare persistent Android signing key
        env:
          SIGNING_KEY_BASE64: ${{ secrets.TOMOS_SIGNING_KEY_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.TOMOS_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.TOMOS_SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.TOMOS_SIGNING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          values=( "$SIGNING_KEY_BASE64" "$SIGNING_STORE_PASSWORD" "$SIGNING_KEY_ALIAS" "$SIGNING_KEY_PASSWORD" )
          present=0
          for value in "${values[@]}"; do
            if [ -n "$value" ]; then present=$((present + 1)); fi
          done
          if [ "$present" -eq 0 ] && [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "Signing secrets are unavailable; this non-main build will use the runner debug key."
            exit 0
          fi
          if [ "$present" -ne 4 ]; then
            echo "::error::All four TOMOS_SIGNING_* repository secrets must be configured before a main-branch APK can be built."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/tomos-signing"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/tomos-signing/tomos.keystore"
          test -s "$RUNNER_TEMP/tomos-signing/tomos.keystore"
          {
            echo "TOMOS_SIGNING_STORE_FILE=$RUNNER_TEMP/tomos-signing/tomos.keystore"
            echo "TOMOS_SIGNING_STORE_PASSWORD=$SIGNING_STORE_PASSWORD"
            echo "TOMOS_SIGNING_KEY_ALIAS=$SIGNING_KEY_ALIAS"
            echo "TOMOS_SIGNING_KEY_PASSWORD=$SIGNING_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -PversionCode="${GITHUB_RUN_NUMBER}" assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Check in-place update compatibility
        if: env.TOMOS_SIGNING_STORE_FILE != ''
        env:
          TOMOS_ALLOW_SIGNING_MIGRATION: ${{ vars.TOMOS_ALLOW_SIGNING_MIGRATION }}
        run: python3 scripts/check_apk_update_compatibility.py

      - name: Create SHA-256 checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomOS-SIP-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: TomOS SIP Build ${{ github.run_number }}
          tag_name: v0.1.0-build-${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
