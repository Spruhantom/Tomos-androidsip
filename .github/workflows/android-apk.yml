name: TomOS SIP Android APK

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tomos-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  unit-tests:
    name: Run Kotlin unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Android unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TomOS-SIP-Unit-Test-Reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  premium-persistence-tests:
    name: Test Premium licence persistence on Android
    # GitHub-hosted Linux runners do not expose usable KVM to this job.
    # macOS provides native hardware acceleration for the Android emulator.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator platforms;android-35 system-images;android-35;google_apis;x86_64
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Record emulator host diagnostics
        continue-on-error: true
        run: |
          uname -a || true
          sw_vers || true
          java -version || true
          command -v adb || true
          command -v emulator || true
          adb version || true
          if [ -x "${ANDROID_HOME}/emulator/emulator" ]; then "${ANDROID_HOME}/emulator/emulator" -version || true; fi
      - name: Run Android Keystore persistence tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          target: google_apis
          disable-animations: true
          emulator-boot-timeout: 900
          # API 35 recommends software rendering on macOS; host OpenGL is deprecated.
          emulator-options: -no-window -gpu software -no-snapshot -noaudio -no-boot-anim
          # Ensure the ADB daemon is listening before the emulator process starts.
          pre-emulator-launch-script: |
            adb start-server
            adb devices -l
          script: |
            mkdir -p app/build/reports/androidTests/connected
            adb start-server
            adb devices -l
            adb -s emulator-5554 wait-for-device
            python3 - <<'PY'
            import subprocess
            import sys
            import time

            deadline = time.monotonic() + 180
            while time.monotonic() < deadline:
                try:
                    result = subprocess.run(
                        ["adb", "-s", "emulator-5554", "shell", "getprop", "sys.boot_completed"],
                        check=False, capture_output=True, text=True, timeout=10,
                    )
                    if result.returncode == 0 and result.stdout.strip() == "1":
                        print("Android emulator boot completed.", flush=True)
                        break
                except subprocess.TimeoutExpired:
                    pass
                time.sleep(3)
            else:
                print("Android emulator did not report sys.boot_completed=1.", file=sys.stderr)
                raise SystemExit(1)
            PY
            # Bound the instrumentation run and kill its process group on timeout.
            python3 - <<'PY'
            import os
            import signal
            import subprocess
            import sys

            process = subprocess.Popen(
                ["gradle", "--no-daemon", "--stacktrace", "--console=plain", "connectedDebugAndroidTest"],
                start_new_session=True,
            )
            try:
                exit_code = process.wait(timeout=600)
            except subprocess.TimeoutExpired:
                print("Android instrumentation tests exceeded the 10-minute limit.", file=sys.stderr)
                try:
                    os.killpg(process.pid, signal.SIGTERM)
                    process.wait(timeout=15)
                except subprocess.TimeoutExpired:
                    os.killpg(process.pid, signal.SIGKILL)
                    process.wait()
                raise SystemExit(124)
            raise SystemExit(exit_code)
            PY
      - name: Collect emulator diagnostics
        if: always()
        run: |
          mkdir -p app/build/reports/androidTests/connected
          python3 - <<'PY'
          import subprocess
          from pathlib import Path

          out = Path("app/build/reports/androidTests/connected")
          commands = {
              "adb-devices.txt": ["adb", "devices", "-l"],
              "emulator-logcat.txt": ["adb", "-s", "emulator-5554", "logcat", "-d", "-t", "5000"],
          }
          for filename, command in commands.items():
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=15)
                  (out / filename).write_text(result.stdout + result.stderr)
              except Exception as error:
                  (out / filename).write_text(f"Diagnostic command failed: {error}\n")
          PY
          ps aux | grep -E '[e]mulator|[q]emu' > app/build/reports/androidTests/connected/emulator-processes.txt || true
          find "$HOME/.android/avd" -maxdepth 3 -type f -print 2>/dev/null > app/build/reports/androidTests/connected/avd-files.txt || true
      - name: Upload Android instrumentation reports and emulator logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TomOS-SIP-Android-Persistence-Test-Reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -PversionCode="${GITHUB_RUN_NUMBER}" assembleDebug
      - name: Verify release build requires a production Ed25519 public key
        shell: bash
        run: |
          if gradle --no-daemon :app:assembleRelease > /tmp/release-no-key.log 2>&1; then
            cat /tmp/release-no-key.log
            echo "Release build unexpectedly accepted a missing Premium public key."
            exit 1
          fi
          grep -F "Release builds require" /tmp/release-no-key.log

          mkdir -p /tmp/tomos-premium-key-check
          printf '%s\n' \
            '-----BEGIN PUBLIC KEY-----' \
            'MCowBQYDK2VwAyEAebVWLo/mVPlAeLES6KmLp5AfhTrmlb7X4OORC60ElmQ=' \
            '-----END PUBLIC KEY-----' > /tmp/tomos-premium-key-check/fixture.pem
          if TOMOS_PREMIUM_PUBLIC_KEY="$(cat /tmp/tomos-premium-key-check/fixture.pem)" \
            gradle --no-daemon :app:assembleRelease > /tmp/release-fixture-key.log 2>&1; then
            cat /tmp/release-fixture-key.log
            echo "Release build unexpectedly accepted the shared test fixture key."
            exit 1
          fi
          grep -F "shared cross-language CI fixture key is test-only" /tmp/release-fixture-key.log

          openssl genpkey -algorithm ED25519 -out /tmp/tomos-premium-key-check/private.pem
          openssl pkey -in /tmp/tomos-premium-key-check/private.pem -pubout \
            -out /tmp/tomos-premium-key-check/public.pem
          TOMOS_PREMIUM_PUBLIC_KEY="$(cat /tmp/tomos-premium-key-check/public.pem)" \
            gradle --no-daemon --stacktrace :app:assembleRelease
      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk
      - name: Create SHA-256 checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomOS-SIP-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: TomOS SIP Build ${{ github.run_number }}
          tag_name: v0.1.0-build-${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
