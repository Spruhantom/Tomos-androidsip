name: TomOS SIP Android APK

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tomos-android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  unit-tests:
    name: Run Kotlin unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TomOS-SIP-Unit-Test-Reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Keep the debug signing identity stable for successive main-branch APK releases.
      # Existing APKs built before this cache was introduced may still require one reinstall.
      - name: Restore persistent Android debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: tomos-android-debug-keystore-v1-${{ github.ref == 'refs/heads/main' && 'main' || github.ref }}
          restore-keys: |
            tomos-android-debug-keystore-v1-main

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -PversionCode="${GITHUB_RUN_NUMBER}" assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Check in-place update compatibility
        run: python3 scripts/check_apk_update_compatibility.py

      - name: Create SHA-256 checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk > app/build/outputs/apk/debug/app-debug.apk.sha256

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TomOS-SIP-Android-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          name: TomOS SIP Build ${{ github.run_number }}
          tag_name: v0.1.0-build-${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
